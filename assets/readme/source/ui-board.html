<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 530px; background: #F8F8F8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #17191C; position: relative; overflow: hidden;
  }
  .frame { position: absolute; inset: 0; border: 1.5px solid #E0E0E0; border-radius: 14px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .head { position: absolute; top: 32px; left: 96px; right: 96px; }
  .head .l { font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #6B7076; }
  .row { position: absolute; top: 32px; left: 96px; display: flex; gap: 148px; }
  figure { width: 430px; }
  .screen { width: 430px; height: 390px; border: 1px solid #E0E0E0; border-radius: 12px; overflow: hidden; background: #fff; }
  .screen img { display: block; width: 430px; height: 390px; }
  figcaption { padding-top: 22px; }
  .cap-t { font-size: 21px; font-weight: 650; color: #17191C; }
  .cap-t .idx { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; color: #6B7076; margin-right: 12px; }
  .cap-d { margin-top: 9px; font-size: 17px; color: #6B7076; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="row">
    <figure>
      <div class="screen"><img src="ui-consult.png" alt=""></div>
      <figcaption>
        <div class="cap-t"><span class="idx">01–02</span>会话里的建议到院卡片</div>
        <div class="cap-d">医生推送 · 一键去预约挂号</div>
      </figcaption>
    </figure>
    <figure>
      <div class="screen"><img src="ui-slots.png" alt=""></div>
      <figcaption>
        <div class="cap-t"><span class="idx">03</span>近期号源与余量</div>
        <div class="cap-d">余 16 / 20 · 分时段锁号</div>
      </figcaption>
    </figure>
  </div>
</body>
</html>
