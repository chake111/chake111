<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="352" viewBox="0 0 1200 352"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">冯键怀 @chake111 — 后端为主的全栈工程师</title>
  <desc id="heroDesc">左侧是姓名、定位与一句话价值；右侧是宠物医院三端系统的六个业务环节，从线上图文问诊到诊后三维评价。</desc>

  <rect width="1200" height="352" rx="14" fill="#0786B5"/>

  <!-- identity -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="96" y="118" font-size="64" font-weight="700" fill="#FFFFFF">冯键怀</text>
    <text x="306" y="118" font-size="16" fill="#FFFFFF" fill-opacity="0.6">@chake111</text>

    <text x="96" y="168" font-size="24" font-weight="650" fill="#FFFFFF" fill-opacity="0.96">后端为主的全栈工程师</text>

    <text x="96" y="212" font-size="20" fill="#FFFFFF" fill-opacity="0.9">从表结构到最后一屏，</text>
    <text x="96" y="244" font-size="20" fill="#FFFFFF" fill-opacity="0.9">一个人把需求做成能上线的三端系统。</text>

    <text x="96" y="292" font-size="15" fill="#FFFFFF" fill-opacity="0.62">三端 · 33 张实机截图 · 9 篇 ADR</text>
  </g>

  <!-- system chain -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="660" y="62" font-size="15" font-weight="600" fill="#FFFFFF" fill-opacity="0.62">系统链路 · 宠物医院</text>

    <line x1="700" y1="104" x2="700" y2="304" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

    <!-- 01 -->
    <circle cx="700" cy="104" r="4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="724" y="109" font-size="14" fill="#FFFFFF" fill-opacity="0.52">01</text>
    <text x="758" y="110" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">线上图文问诊</text>
    <text x="1104" y="109" text-anchor="end" font-size="15" fill="#FFFFFF" fill-opacity="0.74">双工会话 · 已读回执</text>

    <!-- 02 -->
    <circle cx="700" cy="144" r="5" fill="#FFFFFF"/>
    <text x="724" y="149" font-size="14" fill="#FFFFFF" fill-opacity="0.9">02</text>
    <text x="758" y="150" font-size="20" font-weight="700" fill="#FFFFFF">医生建议到院</text>
    <text x="1104" y="149" text-anchor="end" font-size="15" fill="#FFFFFF" fill-opacity="0.9">会话内推卡 · 直达挂号</text>

    <!-- 03 -->
    <circle cx="700" cy="184" r="4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="724" y="189" font-size="14" fill="#FFFFFF" fill-opacity="0.52">03</text>
    <text x="758" y="190" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">锁号与支付</text>
    <text x="1104" y="189" text-anchor="end" font-size="15" fill="#FFFFFF" fill-opacity="0.74">行级条件更新 · 不超卖</text>

    <!-- 04 -->
    <circle cx="700" cy="224" r="4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="724" y="229" font-size="14" fill="#FFFFFF" fill-opacity="0.52">04</text>
    <text x="758" y="230" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">医生接诊</text>
    <text x="1104" y="229" text-anchor="end" font-size="15" fill="#FFFFFF" fill-opacity="0.74">三栏同屏 · 病历锁定</text>

    <!-- 05 -->
    <circle cx="700" cy="264" r="4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="724" y="269" font-size="14" fill="#FFFFFF" fill-opacity="0.52">05</text>
    <text x="758" y="270" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">电子病历</text>
    <text x="1104" y="269" text-anchor="end" font-size="15" fill="#FFFFFF" fill-opacity="0.74">影像挂载 · 复诊</text>

    <!-- 06 -->
    <circle cx="700" cy="304" r="4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="724" y="309" font-size="14" fill="#FFFFFF" fill-opacity="0.52">06</text>
    <text x="758" y="310" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">三维评价</text>
    <text x="1104" y="309" text-anchor="end" font-size="15" fill="#FFFFFF" fill-opacity="0.74">公开回复 · 评分</text>
  </g>
</svg>
